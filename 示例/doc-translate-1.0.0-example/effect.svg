<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><rect width="1500" height="1080" fill="#EFF5F2"/><g font-family="PingFang SC,Arial,sans-serif"><text x="60" y="80" font-size="40" font-weight="700" fill="#153B32">专业文档翻译与校对</text><text x="60" y="132" font-size="25" fill="#526D65">1.0.0 · 实际运行示例 · 同一份 Markdown 的片段摘录</text><rect x="50" y="190" width="640" height="690" rx="22" fill="white" stroke="#C5D8D2"/><text x="80" y="245" font-size="28" font-weight="700" fill="#173F37">输入 · 原始文档</text><text x="80" y="300" font-size="24" fill="#223D36">团队负责人可以创建目标，团队成员只能更新自己负</text><text x="80" y="338" font-size="24" fill="#223D36">责的关键结果。</text><text x="80" y="404" font-size="24" fill="#223D36">2. 填写进展说明后保存；进度更新不需要负责人审</text><text x="80" y="442" font-size="24" fill="#223D36">核。</text><text x="80" y="508" font-size="24" fill="#223D36">| 截止日期 | 2026-12-31 |</text><text x="80" y="574" font-size="24" fill="#223D36">| 提醒阈值 | 完成率低于 60% 时提醒负责人 |</text><rect x="810" y="190" width="640" height="690" rx="22" fill="white" stroke="#C5D8D2"/><text x="840" y="245" font-size="28" font-weight="700" fill="#173F37">输出 · 实际生成的译文</text><text x="840" y="300" font-size="24" fill="#223D36">A team lead can create an objective. A </text><text x="840" y="338" font-size="24" fill="#223D36">team member can only update a key result </text><text x="840" y="376" font-size="24" fill="#223D36">assigned to them.</text><text x="840" y="442" font-size="24" fill="#223D36">2. Enter a progress note and save. </text><text x="840" y="480" font-size="24" fill="#223D36">Progress updates do not require approval </text><text x="840" y="518" font-size="24" fill="#223D36">from the team lead.</text><text x="840" y="584" font-size="24" fill="#223D36">| Deadline | 2026-12-31 |</text><text x="840" y="650" font-size="24" fill="#223D36">| Reminder threshold | Notify the team </text><text x="840" y="688" font-size="24" fill="#223D36">lead when completion falls below 60% |</text><path d="M718 520h61m-18-18 18 18-18 18" fill="none" stroke="#17785E" stroke-width="7" stroke-linecap="round"/><text x="60" y="945" font-size="26" fill="#173F37">再次处理相同输入：28/28 个片段复用，新增待译 0 个</text><text x="60" y="996" font-size="23" fill="#526D65">数值、日期、代码、链接和变量受保护；保留原文件。复用统计不等于 Token 实测。</text><text x="60" y="1042" font-size="20" fill="#526D65">来源：input/help.md → work/translated/help.md；完整文件与校验报告随示例保存。</text></g></svg>